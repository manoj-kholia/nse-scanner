name: Audit the cup-and-handle rules

# Manual. Runs explain_pattern.py on a handful of symbols and commits the
# output, so the gate-by-gate numbers can be read back and compared against
# what the TradingView script draws for the same stock.
#
# It exists because the two implementations read DIFFERENT DATA FEEDS - Yahoo
# here, TradingView there - and the only way to tell a rule bug from a feed
# difference is to put both sets of numbers side by side. Every disagreement
# we have found so far was one or the other, and guessing which was always
# wrong.
#
# The result is committed rather than left in the run summary because the run
# summary needs an authenticated API call to read, and a committed file can be
# fetched from raw.githubusercontent at an exact commit SHA - which also dodges
# the CDN caching that has twice made a stale file look like a fresh one.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols to audit, space separated"
        default: "NPST SOMANYCERA MCX SPLPETRO ANDHRSUGAR MANINDS OPTIEMUS SUBEXLTD MARINE SANSERA"
        required: true
      asof:
        description: "Pretend it is this date (YYYY-MM-DD), ignoring every later bar. Blank = today."
        default: ""
        required: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Explain every gate for each symbol
        run: |
          set -o pipefail
          {
            echo "AUDIT $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            echo "commit  $GITHUB_SHA"
            echo "symbols ${{ inputs.symbols }}"
            echo "asof    ${{ inputs.asof }}"
            echo
            echo "--- the rules this run enforced -------------------------------"
            python -c "import find_patterns as fp; [print(f'  {k:18} {fp.P[k]}') for k in sorted(fp.P)]"
            echo
          } > audit_report.txt

          python explain_pattern.py ${{ inputs.symbols }} \
            --asof "${{ inputs.asof }}" 2>&1 | tee -a audit_report.txt

      - name: Commit the report
        if: always()
        run: |
          git config user.name  "nse-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add -A audit_report.txt 2>/dev/null || true
          git diff --staged --quiet && { echo "report unchanged"; exit 0; }
          git commit -m "Audit $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          for attempt in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
          exit 1

      - name: Also put it in the run summary
        if: always()
        run: |
          {
            echo "## Cup-and-handle audit"
            echo
            echo '```'
            cat audit_report.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
