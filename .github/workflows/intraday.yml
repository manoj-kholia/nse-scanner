name: Morning stocks in play

# Runs a few minutes after the NSE open, once the 09:20 bar has closed.
#
# This is a SELECTION screen, not a tested system. The research it follows
# (Zarattini/Barbon/Aziz) found the opening-range breakout itself returned
# ~3% a year unfiltered, and ~42% when restricted to the stocks with the most
# abnormal opening volume - so the value is in the shortlist, not the entry.
# Free intraday data reaches back ~60 days, which is far too little to
# backtest. Treat the output as a watchlist to study and paper-trade.

on:
  schedule:
    # 03:57 UTC = 09:27 IST. It has to be AFTER the 09:20-09:25 bar closes:
    # Yahoo rewrites the 09:15 bar's volume to zero once a session is history,
    # so relative volume is measured from 09:20 and that bar must exist first.
    - cron: "57 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  in-play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Uses the liquidity figures from last evening's full scan, so this run
      # only has to pull 5-minute bars for ~200 names rather than 2,300.
      - name: Find the stocks in play
        run: python intraday.py

      - name: Build the dashboard data
        run: python build_intraday.py

      - name: Commit the results
        run: |
          git config user.name  "nse-scanner"
          git config user.email "actions@users.noreply.github.com"

          # Everything this run generates. Nothing else belongs here.
          OUTPUTS="docs/intraday.json stocks_in_play.csv intraday_watchlist.txt intraday_status.json"

          stage() {
            for p in $OUTPUTS; do
              # One path at a time: `git add` with several pathspecs stages
              # NOTHING if any one of them is missing.
              [ -e "$p" ] && git add -A "$p" 2>/dev/null || true
            done
          }

          MSG="In play $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          stage
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "$MSG"

          # A scan takes minutes. If anything else pushed to main while it ran
          # - the other workflow, or a person - a bare `git push` is rejected
          # and the whole run's work is thrown away with exit code 1. So on a
          # rejection: keep THIS run's freshly generated output, take every
          # other file from the remote, and commit again on top.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) - the remote moved while this run was working"
            TMP=$(mktemp -d)
            KEEP=""
            for p in $OUTPUTS; do [ -e "$p" ] && KEEP="$KEEP $p"; done
            [ -n "$KEEP" ] && tar cf "$TMP/out.tar" $KEEP
            git fetch origin main
            git reset --hard origin/main
            [ -n "$KEEP" ] && tar xf "$TMP/out.tar"
            rm -rf "$TMP"
            stage
            git diff --staged --quiet && { echo "remote already has this"; exit 0; }
            git commit -m "$MSG"
          done
          echo "Could not push after 3 attempts."
          exit 1
