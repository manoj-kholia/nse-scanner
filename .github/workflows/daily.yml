name: Daily NSE scan

on:
  schedule:
    # 13:00 UTC = 18:30 IST, Monday-Friday (after the market closes)
    - cron: "0 13 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices for every NSE stock
        run: python update_nse_data.py --pause 2

      - name: Screen for stocks in an uptrend near their highs
        run: python screen_stocks.py

      - name: Check the market's health
        run: python market_filter.py

      # Also counts the base stage, and checks O'Neil's C and A (quarterly and
      # annual earnings) for the handful of names that make it through. Late
      # bases and weak earnings are flagged on the dashboard, not dropped -
      # free fundamentals for Indian small caps are too patchy to filter on.
      - name: Look for cup-and-handle bases, then check their earnings
        run: python find_patterns.py --days 5

      - name: Build the dashboard data
        run: python build_site.py

      - name: Commit the results
        run: |
          git config user.name  "nse-scanner"
          git config user.email "actions@users.noreply.github.com"

          # Everything this run generates. Nothing else belongs here.
          OUTPUTS="docs EQUITY_L_live.csv cup_handle_signals.csv market.json update_log.txt"

          stage() {
            for p in $OUTPUTS; do
              # One path at a time: `git add` with several pathspecs stages
              # NOTHING if any one of them is missing.
              [ -e "$p" ] && git add -A "$p" 2>/dev/null || true
            done
          }

          MSG="Scan $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          stage
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "$MSG"

          # A scan takes minutes. If anything else pushed to main while it ran
          # - the other workflow, or a person - a bare `git push` is rejected
          # and the whole run's work is thrown away with exit code 1. So on a
          # rejection: keep THIS run's freshly generated output, take every
          # other file from the remote, and commit again on top.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) - the remote moved while this run was working"
            TMP=$(mktemp -d)
            KEEP=""
            for p in $OUTPUTS; do [ -e "$p" ] && KEEP="$KEEP $p"; done
            [ -n "$KEEP" ] && tar cf "$TMP/out.tar" $KEEP
            git fetch origin main
            git reset --hard origin/main
            [ -n "$KEEP" ] && tar xf "$TMP/out.tar"
            rm -rf "$TMP"
            stage
            git diff --staged --quiet && { echo "remote already has this"; exit 0; }
            git commit -m "$MSG"
          done
          echo "Could not push after 3 attempts."
          exit 1
